## CSSParser API / CSS 解析器 API

module: backend.css_parser
class: GTKCSSColorResolver

### parse_file

```python
def parse_file(css_path: str) -> Dict[str, str]:
    """
    解析 CSS 文件返回颜色字典 / Parse CSS file and return color dictionary

    Args:
        css_path (str): CSS 文件路径 / CSS file path

    Returns:
        Dict[str, str]: 颜色名称到值的映射 / Color name to value mapping
            示例 / Example: {"bg": "#13181C", "color1": "#ED6500"}

    Algorithm:
        1. 正则表达式提取 @define-color / Regex extract @define-color
        2. 递归解析变量引用 / Recursively resolve references
        3. 验证颜色格式 / Validate color formats
        4. 转换为大写十六进制 / Convert to uppercase hex

    Performance:
        - 解析时间 / Parse time: < 5ms

    Example:
        >>> parser = GTKCSSColorResolver()
        >>> colors = parser.parse_file("base.css")
        >>> print(colors["bg"])  # "#13181C"
    """
```

### to_qml_format

```python
def to_qml_format(colors: Dict[str, str]) -> str:
    """
    转换为 QML Singleton 格式 / Convert to QML Singleton format

    Args:
        colors (Dict[str, str]): 颜色字典 / Color dictionary

    Returns:
        str: QML 文件内容 / QML file content
            包含 pragma Singleton 和 readonly property 定义
            Contains pragma Singleton and readonly property definitions

    Example:
        >>> qml_content = parser.to_qml_format(colors)
        >>> with open("KlipperColors.qml", "w") as f:
        ...     f.write(qml_content)
    """
```

