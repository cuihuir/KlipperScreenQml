## Error Types / 错误类型

```python
class ThemeNotFoundError(Exception):
    """主题目录不存在 / Theme directory not found"""
    pass

class ThemeLoadError(Exception):
    """主题加载失败 / Theme loading failed"""
    pass

class IconNotFoundError(Exception):
    """图标文件不存在 / Icon file not found"""
    pass

class ParseError(Exception):
    """CSS 解析失败 / CSS parsing failed"""
    pass

class ValidationError(Exception):
    """数据验证失败 / Data validation failed"""
    pass
```

