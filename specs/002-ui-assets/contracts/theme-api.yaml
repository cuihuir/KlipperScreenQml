## Performance Guarantees / 性能保证

| 操作 Operation | 目标 Target | 实际 Actual |
|---------------|------------|------------|
| 加载主题 / Load theme | < 200ms | ~100ms |
| 解析 CSS / Parse CSS | < 10ms | ~5ms |
| 加载图标（首次）/ Load icon (first) | < 50ms | ~10-30ms |
| 加载图标（缓存）/ Load icon (cached) | < 5ms | ~1-3ms |
| 预加载 6 个图标 / Preload 6 icons | < 150ms | ~60-120ms |
| 缓存查找 / Cache lookup | < 1ms | < 1ms |
| LRU 淘汰 / LRU eviction | < 10ms | ~5ms |

