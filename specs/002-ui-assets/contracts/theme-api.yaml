## ThemeManager API / 主题管理器 API

module: backend.theme_manager
class: ThemeManager

### loadTheme

```python
def loadTheme(theme_name: str) -> Theme:
    """
    加载指定主题的所有素材 / Load all assets for specified theme

    Args:
        theme_name (str): 主题名称 / Theme name
            可用值 / Valid values: "material-dark", "material-darker",
            "material-light", "colorized", "z-bolt", "base"

    Returns:
        Theme: 主题对象，包含颜色和图标 / Theme object with colors and icons

    Raises:
        ThemeNotFoundError: 主题目录不存在 / Theme directory not found
        ThemeLoadError: 主题素材加载失败 / Theme asset loading failed
        ValidationError: 主题名称无效 / Invalid theme name

    Performance:
        - 首次加载 / First load: < 100ms
        - 缓存加载 / Cached load: < 10ms

    Example:
        >>> manager = ThemeManager(theme_dir="KlipperScreen/styles")
        >>> theme = manager.loadTheme("material-dark")
        >>> print(theme.name)  # "material-dark"
        >>> print(theme.icon_count)  # 104
    """
```

### parseThemeColors

```python
def parseThemeColors(css_file_path: str) -> ColorPalette:
    """
    从 CSS 文件解析颜色定义 / Parse color definitions from CSS file

    Args:
        css_file_path (str): CSS 文件绝对路径 / CSS file absolute path
            示例 / Example: "KlipperScreen/styles/base.css"

    Returns:
        ColorPalette: 颜色调色板对象 / ColorPalette object
            包含所有 @define-color 定义 / Contains all @define-color definitions

    Raises:
        FileNotFoundError: CSS 文件不存在 / CSS file not found
        ParseError: CSS 解析失败 / CSS parsing failed
        ValidationError: 颜色格式无效 / Invalid color format

    Algorithm:
        1. 读取 CSS 文件内容 / Read CSS file content
        2. 提取 @define-color 定义 / Extract @define-color definitions
        3. 递归解析颜色引用 (@bg, @text) / Resolve color references
        4. 验证颜色格式 (#RRGGBB) / Validate color formats
        5. 返回 ColorPalette / Return ColorPalette

    Performance:
        - 解析 10-15 个颜色定义 / Parse 10-15 colors: < 5ms

    Example:
        >>> palette = manager.parseThemeColors("base.css")
        >>> print(palette.bg)  # "#13181C"
        >>> print(palette.color1)  # "#ED6500"
    """
```

