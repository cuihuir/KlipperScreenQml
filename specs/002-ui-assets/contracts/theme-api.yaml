## Usage Examples / 使用示例

### Python Backend / Python 后端

```python
# 初始化主题系统 / Initialize theme system
from backend.theme_manager import ThemeManager
from backend.asset_cache import AssetCache

cache = AssetCache(max_cache_size=20 * 1024 * 1024)
manager = ThemeManager(
    theme_dir="KlipperScreen/styles",
    cache=cache
)

# 加载主题 / Load theme
theme = manager.loadTheme("material-dark")
print(f"Loaded theme: {theme.name}")
print(f"Colors: {theme.colors.to_dict()}")
print(f"Icons: {theme.icon_count}")

# 创建 QML 提供者 / Create QML provider
from backend.theme_provider import ThemeProvider
provider = ThemeProvider(theme)

# 暴露给 QML / Expose to QML
engine.rootContext().setContextProperty("ThemeProvider", provider)
```

### QML Frontend / QML 前端

```qml
import QtQuick

Rectangle {
    // 使用主题颜色 / Use theme colors
    color: ThemeProvider.backgroundColor

    Image {
        // 使用主题图标 / Use theme icon
        source: ThemeProvider.getIconPath("home")
        sourceSize: Qt.size(48, 48)
        cache: true
        asynchronous: true
    }

    Text {
        color: ThemeProvider.textColor
        text: "Current theme: " + ThemeProvider.currentTheme
    }

    Button {
        onClicked: {
            // 切换主题 / Switch theme
            ThemeProvider.setTheme("material-light")
        }
    }

    Connections {
        target: ThemeProvider
        function onThemeChanged() {
            console.log("Theme changed!")
        }
    }
}
```

