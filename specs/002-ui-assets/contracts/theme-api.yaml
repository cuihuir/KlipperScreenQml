## AssetCache API / 素材缓存 API

module: backend.asset_cache
class: AssetCache

### get

```python
def get(icon_name: str) -> Optional[IconAsset]:
    """
    获取图标并更新访问时间 / Get icon and update access time

    Args:
        icon_name (str): 图标名称 / Icon name

    Returns:
        Optional[IconAsset]: 图标对象或 None / Icon object or None

    Side effects:
        - 更新访问时间戳用于 LRU / Update access timestamp for LRU

    Performance:
        - 查找时间 / Lookup time: O(1), < 1ms
    """
```

### set

```python
def set(icon_name: str, icon: IconAsset) -> None:
    """
    添加图标到缓存，必要时淘汰 / Add icon to cache, evict if necessary

    Args:
        icon_name (str): 图标名称 / Icon name
        icon (IconAsset): 图标对象 / Icon object

    Behavior:
        1. 计算图标大小 / Calculate icon size
        2. 如果超过限制，LRU 淘汰 / If exceeds limit, LRU evict
        3. 添加到缓存 / Add to cache
        4. 更新缓存大小 / Update cache size

    Constraints:
        - cache_size_bytes <= max_cache_size (20MB)

    Performance:
        - 添加时间 / Add time: < 5ms
        - 淘汰时间 / Eviction time: < 10ms
    """
```

### evict_lru

```python
def evict_lru() -> None:
    """
    淘汰最久未使用的图标 / Evict least recently used icon

    Algorithm:
        1. 查找最小访问时间戳 / Find minimum access timestamp
        2. 移除图标 / Remove icon
        3. 更新缓存大小 / Update cache size

    Performance:
        - 淘汰时间 / Eviction time: O(n), < 10ms
    """
```

