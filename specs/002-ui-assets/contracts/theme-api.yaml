## IconLoader API / 图标加载器 API

module: backend.icon_loader
class: IconLoader

### loadIcon

```python
def loadIcon(icon_name: str, theme: Theme) -> IconAsset:
    """
    加载指定图标，优先使用缓存 / Load specified icon, prefer cache

    Args:
        icon_name (str): 图标名称（不含扩展名） / Icon name (without extension)
            示例 / Example: "home", "settings", "printer"
        theme (Theme): 当前主题 / Current theme

    Returns:
        IconAsset: 图标对象或回退占位符 / Icon object or fallback placeholder

    Raises:
        IconNotFoundError: 图标文件不存在且无回退 / Icon not found and no fallback

    Fallback behavior / 回退行为:
        1. 在主题图标目录查找 / Search in theme icons directory
        2. 在基础主题查找 / Search in base theme
        3. 返回默认占位符图标 / Return default placeholder icon

    Performance:
        - 缓存命中 / Cache hit: < 5ms
        - 缓存未命中 / Cache miss: < 50ms

    Example:
        >>> loader = IconLoader(cache=AssetCache())
        >>> icon = loader.loadIcon("home", current_theme)
        >>> print(icon.file_path)  # Path(".../ material-dark/images/home.svg")
        >>> print(icon.is_cached)  # True
    """
```

### preloadIcons

```python
def preloadIcons(icon_names: List[str], theme: Theme) -> None:
    """
    预加载图标列表到缓存 / Preload icon list to cache

    Args:
        icon_names (List[str]): 图标名称列表 / Icon name list
            示例 / Example: ["home", "back", "settings"]
        theme (Theme): 当前主题 / Current theme

    Purpose / 用途:
        应用启动时预加载关键图标，减少首次渲染延迟
        Preload critical icons at app startup to reduce initial render delay

    Performance:
        - 每个图标 / Per icon: ~10-20ms
        - 6 个图标 / 6 icons: ~60-120ms (可接受 / acceptable)

    Example:
        >>> critical_icons = ["home", "back", "files", "control", "settings", "dashboard"]
        >>> loader.preloadIcons(critical_icons, current_theme)
        # Icons now in cache for instant rendering
    """
```

### getIconPath

```python
def getIconPath(icon_name: str, theme: Theme, format: str = "file") -> str:
    """
    获取图标路径（URL 格式）/ Get icon path (URL format)

    Args:
        icon_name (str): 图标名称 / Icon name
        theme (Theme): 当前主题 / Current theme
        format (str): 路径格式 / Path format
            可用值 / Valid values: "file", "qrc"

    Returns:
        str: 图标 URL 路径 / Icon URL path
            file 格式 / file format: "file:///path/to/icon.svg"
            qrc 格式 / qrc format: "qrc:/assets/icons/home.svg"

    Example:
        >>> path = loader.getIconPath("home", theme, format="file")
        >>> print(path)  # "file:///home/tope/.../home.svg"
    """
```

